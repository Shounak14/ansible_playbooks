---
- name: Read the JSON file
  set_fact:
        users_data: "{{ lookup('file', src_json) | from_json }}"

- name: Transform JSON into expected format
  set_fact:
         output_data: "{{ (output_data | default([])) + [ {
           'id': item.id,
           'first_name': item.profile.first_name,
           'zip_code': item.profile.address.zip_code,
           'total_money_spent_on_orders': item.orders | map(attribute='total_amount') | sum,
           'total_order': item.orders | length,
           'list_of_all_orders_id': item.orders | map(attribute='order_id') | list,
           } ] }}"
  loop: "{{ users_data.users }}"
  loop_control:
        loop_var: item

- name: Show the expected output
  debug:
        var: output_data
